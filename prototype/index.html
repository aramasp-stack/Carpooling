<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TransportApp — прототип</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <div class="grip" aria-hidden="true"></div>
    <header class="brand">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11v6a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H8v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-6zm2.2-1h9.6l-1-3H8.2l-1 3zM7.5 14a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5zm9 0a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5z"/></svg>
      </div>
      <div>
        <div class="logo">TransportApp</div>
        <div class="tagline">Попутчики по Еревану</div>
      </div>
      <span class="badge">прототип</span>
    </header>
    <nav class="tabs" role="tablist">
      <button data-tab="search" class="active">Поиск</button>
      <button data-tab="routes">Маршруты</button>
      <button data-tab="mine">Мои поездки</button>
    </nav>
    <section id="view"></section>
  </aside>

  <div id="modal" hidden><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
